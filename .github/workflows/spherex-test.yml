name: SPHEREx Pipeline Test

on:
  workflow_dispatch:          # manual trigger bhi
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install astropy astroquery numpy matplotlib

      - name: Run SPHEREx pipeline test
        run: python scripts/spherex_pipeline_test.py

      - name: Upload cutout FITS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spherex-cutout-fits
          path: outputs/*.fits
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload visualizations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spherex-plots
          path: outputs/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log
          path: outputs/pipeline_log.txt
          retention-days: 7
          if-no-files-found: ignore